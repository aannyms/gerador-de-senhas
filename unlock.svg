<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
  <path d="M7 11V7a5 5 0 0 1 9.9-1" />
</svg>
/* Estilização do SVG via CSS */
.icon-unlock {
  width: 32px;
  height: 32px;
  stroke: #58a6ff; /* Cor da linha */
  transition: stroke 0.2s ease, transform 0.2s ease;
}

.icon-unlock:hover {
  stroke: #2ea043; /* Cor ao passar o mouse */
  transform: scale(1.1);
}
<!-- Exemplo de uso inline -->
<svg class="icon-unlock" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
  <path d="M7 11V7a5 5 0 0 1 9.9-1" />
</svg>