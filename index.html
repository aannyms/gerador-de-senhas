<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Gerador de senhas</h1>

            <!-- CAMPO ONDE VOCÊ PODE ESCREVER -->
            <div class="password-area">
                <input
                    type="text"
                    id="password"
                    placeholder="Digite sua senha"
                    autocomplete="off"
                >

                <button type="button" class="copy-button">
                    📋
                </button>
            </div>


            <div class="content">

                <!-- ESQUERDA -->
                <div class="left">

                    <p class="title">
                        nível de segurança
                    </p>

                    <div class="security-bar">
                        <div class="security-level"></div>
                    </div>


                    <p class="title characters-title">
                        número de caracteres
                    </p>

                    <div class="counter">

                        <button type="button">
                            −
                        </button>

                        <input
                            type="number"
                            value="8"
                            min="8"
                            max="32"
                        >

                        <button type="button">
                            +
                        </button>

                    </div>

                </div>


                <!-- DIREITA -->
                <div class="requirements">

                    <label>
                        <input
                            type="checkbox"
                            checked
                        >

                        <span class="circle"></span>

                        no mínimo 8 caracteres
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            checked
                        >

                        <span class="circle"></span>

                        uma letra maiúscula
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            checked
                        >

                        <span class="circle"></span>

                        um caractere especial,
                        como @,#,$,!
                    </label>


                    <label>
                        <input
                            type="checkbox"
                            checked
                        >

                        <span class="circle"></span>

                        uma letra minúscula
                    </label>


                    <label>
                        <input type="checkbox">

                        <span class="circle"></span>

                        um número
                    </label>

                </div>

            </div>


            <button
                type="button"
                class="generate"
            >
                Gerar senha
            </button>

        </div>

    </div>

</body>
</html>
