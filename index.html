<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="card-container">

        <!-- TÍTULO -->
        <h1 class="title">
            Gerador de senhas
        </h1>


        <!-- CAMPO DA SENHA -->
        <div class="password-field">

            <input
                type="text"
                class="password-input"
                placeholder="Digite sua senha"
            >

            <button
                type="button"
                class="copy-button"
                title="Copiar"
            >
                📋
            </button>

        </div>


        <!-- CONTEÚDO -->
        <div class="content-body">


            <!-- COLUNA ESQUERDA -->
            <div class="left-column">


                <!-- SEGURANÇA -->
                <div class="security-section">

                    <label class="label">
                        nível de segurança
                    </label>

                    <div class="strength-bar">

                        <div class="strength-fill"></div>

                    </div>

                </div>


                <!-- NÚMERO DE CARACTERES -->
                <div class="characters-section">

                    <label class="label">
                        número de caracteres
                    </label>

                    <div class="counter-control">

                        <button
                            type="button"
                            class="btn-counter"
                        >
                            −
                        </button>

                        <input
                            type="number"
                            class="counter-input"
                            value="8"
                            min="8"
                            max="32"
                        >

                        <button
                            type="button"
                            class="btn-counter"
                        >
                            +
                        </button>

                    </div>

                </div>

            </div>


            <!-- COLUNA DIREITA -->
            <div class="right-column">

                <ul class="requirements-list">


                    <li>

                        <label class="check-option">

                            <input
                                type="checkbox"
                                checked
                            >

                            <span class="dot"></span>

                            <span>
                                no mínimo 8 caracteres
                            </span>

                        </label>

                    </li>


                    <li>

                        <label class="check-option">

                            <input
                                type="checkbox"
                                checked
                            >

                            <span class="dot"></span>

                            <span>
                                uma letra maiúscula
                            </span>

                        </label>

                    </li>


                    <li>

                        <label class="check-option">

                            <input
                                type="checkbox"
                                checked
                            >

                            <span class="dot"></span>

                            <span>
                                um caractere especial,<br>
                                como @,#,$,!
                            </span>

                        </label>

                    </li>


                    <li>

                        <label class="check-option">

                            <input
                                type="checkbox"
                                checked
                            >

                            <span class="dot"></span>

                            <span>
                                uma letra minúscula
                            </span>

                        </label>

                    </li>


                    <li>

                        <label class="check-option">

                            <input
                                type="checkbox"
                            >

                            <span class="dot"></span>

                            <span>
                                um número
                            </span>

                        </label>

                    </li>


                </ul>

            </div>

        </div>


        <!-- BOTÃO -->
        <button
            type="button"
            class="generate-button"
        >
            Gerar senha
        </button>


    </main>

</body>

</html>

<input
    type="text"
    class="password-input"
    placeholder="Digite sua senha"
>
<div class="password-field">
    <input
        type="text"
        id="password"
        name="password"
        placeholder="Digite sua senha aqui"
    >
</div>
