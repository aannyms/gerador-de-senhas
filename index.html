<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="container">

    <section class="card">

      <h1>Gerador de senhas</h1>

      <!-- Senha gerada -->
      <div class="password-box">
        <span id="password">Clique em gerar</span>
        <button id="copyButton" title="Copiar senha">📋</button>
      </div>

      <!-- Configurações -->
      <div class="settings">

        <div class="left-column">

          <label for="length">número de caracteres</label>

          <div class="counter">
            <button id="decrease">−</button>
            <span id="length">8</span>
            <button id="increase">+</button>
          </div>

          <label for="strength">nível de segurança</label>

          <div class="strength-bar">
            <div id="strengthProgress"></div>
          </div>

          <span id="strengthText">Fraca</span>

        </div>

        <!-- Requisitos -->
        <div class="requirements">

          <label class="requirement">
            <input type="checkbox" id="minLength" checked disabled>
            <span></span>
            no mínimo 8 caracteres
          </label>

          <label class="requirement">
            <input type="checkbox" id="uppercase" checked>
            <span></span>
            uma letra maiúscula
          </label>

          <label class="requirement">
            <input type="checkbox" id="special" checked>
            <span></span>
            um caractere especial,<br>
            como @,#,$,!
          </label>

          <label class="requirement">
            <input type="checkbox" id="lowercase" checked>
            <span></span>
            uma letra minúscula
          </label>

          <label class="requirement">
            <input type="checkbox" id="number">
            <span></span>
            um número

          </label>

        </div>

      </div>

      <button class="generate-button" id="generate">
        Gerar senha
      </button>

      <p id="copyMessage"></p>

    </section>

  </main>

  <script src="script.js"></script>

</body>
</html>
