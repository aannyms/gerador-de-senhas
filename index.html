<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerador de Senhas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="card-container">
    <!-- Título Principal -->
    <h1 class="title">Gerador de senhas</h1>

    <!-- Campo do resultado da senha -->
    <div class="password-field"></div>

    <div class="content-body">
      <!-- Coluna da Esquerda: Controles -->
      <div class="left-column">
        <div class="section-group">
          <label class="label">nível de segurança</label>
          <div class="strength-bar">
            <div class="strength-fill"></div>
          </div>
        </div>

        <div class="section-group">
          <label class="label">numero de caracteres</label>
          <div class="counter-control">
            <button class="btn-counter" type="button">-</button>
            <span class="counter-value">3</span>
            <button class="btn-counter" type="button">+</button>
          </div>
        </div>
      </div>

      <!-- Coluna da Direita: Requisitos -->
      <div class="right-column">
        <ul class="requirements-list">
          <li>
            <span class="dot"></span>
            <span>no mínimo 8 caracteres</span>
          </li>
          <li>
            <span class="dot"></span>
            <span>uma letra maiuscula</span>
          </li>
          <li>
            <span class="dot"></span>
            <span>um caractere especial, como @,#,$ ou !</span>
          </li>
          <li>
            <span class="dot"></span>
            <span>uma letra minuscula</span>
          </li>
        </ul>
      </div>
    </div>
  </main>

</body>
</html>
